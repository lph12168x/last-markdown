appId: com.lph12168x.last-markdown
productName: Last Markdown
copyright: Copyright © 2026 lph12168x
directories:
  output: dist
  buildResources: build
icon: build/icon.png
files:
  - out/**/*
  - build/**/*
  - package.json
extraResources:
  - from: build
    to: build
    filter:
      - '**/*'
npmRebuild: false
nodeGypRebuild: false
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  # Uniform release asset names: <product>-<version>-<platform>-<arch>[-<kind>].<ext>
  # The defaults carry the arch on macOS only, and never on Windows or Linux.
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Sign and notarize on macOS when environment variables are present.
  # identity: ${env.APPLE_IDENTITY}
  # notarize:
  #   teamId: ${env.APPLE_TEAM_ID}
win:
  target:
    - nsis
    - portable
linux:
  category: Office
  target:
    - AppImage
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  maintainer: lph12168x
  vendor: lph12168x
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
